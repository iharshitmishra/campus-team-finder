<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Profile | HackMate</title>
  <link rel="stylesheet" href="/src/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__API_BASE__ = ('%VITE_API_BASE%'.startsWith('%') ? '' : '%VITE_API_BASE%') || '';
  </script>
</head>
<body class="bg-canvas text-ink antialiased min-h-screen flex flex-col justify-between selection:bg-terracotta selection:text-white">

  <!-- Simple Header -->
  <header class="border-b border-canvas-border bg-canvas/80 backdrop-blur-md h-16 flex items-center px-4 sm:px-6">
    <div class="max-w-6xl mx-auto w-full flex items-center justify-between">
      <a href="/index.html" class="flex items-center group">
        <img src="/logo.png" alt="HackMate" class="h-8 sm:h-9 w-auto object-contain group-hover:scale-105 transition-transform" />
      </a>
      <a href="/login.html" class="text-xs sm:text-sm font-semibold text-ink-muted hover:text-terracotta transition-colors">
        Already registered? Sign In →
      </a>
    </div>
  </header>

  <!-- Register Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:py-10">
    <div class="auth-card paper-card rounded-2xl max-w-md w-full p-6 sm:p-8 border border-canvas-border shadow-md">
      
      <div class="mb-5 text-center">
        <span class="badge-tag uppercase font-mono text-[11px] text-terracotta font-bold px-2.5 py-0.5 rounded bg-terracotta-light border border-terracotta-border inline-block mb-1.5">
          Join Campus
        </span>
        <h1 class="font-heading font-black text-ink text-2xl">
          Create Student Profile
        </h1>
        <p class="text-xs text-ink-secondary mt-1">
          Set up your department and technical skills to match with hackathon squads.
        </p>
      </div>

      <!-- Error message container -->
      <div id="errorBox" class="hidden mb-4 p-3.5 rounded-xl bg-terracotta-light border border-terracotta-border text-terracotta text-xs font-semibold"></div>

      <form id="registerForm" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Full Name *
          </label>
          <input
            type="text"
            id="name"
            required
            placeholder="e.g. Piyush Sharma"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink transition-colors"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Campus Email *
          </label>
          <input
            type="email"
            id="email"
            required
            placeholder="piyush@campus.edu"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink transition-colors"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Password *
          </label>
          <input
            type="password"
            id="password"
            required
            minlength="4"
            placeholder="Min 4 characters"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink transition-colors"
          />
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
              Branch
            </label>
            <input
              type="text"
              id="branch"
              placeholder="e.g. CS / IT"
              class="w-full text-sm px-3 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
            />
          </div>

          <div>
            <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
              Academic Year
            </label>
            <select
              id="year"
              class="w-full text-sm px-3 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
            >
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year" selected>3rd Year</option>
              <option value="4th Year">4th Year</option>
              <option value="Postgraduate">PG</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Skills (comma-separated)
          </label>
          <input
            type="text"
            id="skills"
            placeholder="React, Python, OpenCV, Node.js"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
          />
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="interactive-btn w-full py-2.5 rounded-lg text-sm font-bold bg-terracotta text-white hover:bg-terracotta-hover transition-colors shadow-xs cursor-pointer mt-1"
        >
          Create Profile
        </button>
      </form>

      <div class="mt-5 text-center text-xs text-ink-muted">
        Already have an account?{' '}
        <a href="/login.html" class="text-terracotta font-bold hover:underline">
          Sign In
        </a>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-ink-muted border-t border-canvas-border">
    HackMate • Secure Authentication
  </footer>

  <script>
    const form = document.getElementById('registerForm');
    const errBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating profile...';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const branch = document.getElementById('branch').value.trim();
      const year = document.getElementById('year').value;
      const skillsRaw = document.getElementById('skills').value;

      const skills = skillsRaw
        .split(',')
        .map(s => s.trim())
        .filter(s => s.length > 0);

      try {
        const apiBase = (window.__API_BASE__ || '').replace(/\/$/, '');
        const res = await fetch(`${apiBase}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, branch, year, skills })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        localStorage.setItem('htf_token', data.token);
        localStorage.setItem('htf_user', JSON.stringify(data.user));
        window.location.href = '/browse-teams.html';
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Create Profile';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('.auth-card', {
          opacity: 0,
          y: 20,
          duration: 0.5,
          ease: 'power3.out'
        });
      }
    });
  </script>

</body>
</html>
