<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign In & Registration | HackMate</title>
  <link rel="stylesheet" href="/src/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__API_BASE__ = ('%VITE_API_BASE%'.startsWith('%') ? '' : '%VITE_API_BASE%') || '';
  </script>
</head>
<body class="bg-canvas text-ink antialiased min-h-screen flex flex-col justify-between selection:bg-terracotta selection:text-white">

  <!-- Simple Header -->
  <header class="border-b border-canvas-border bg-canvas/80 backdrop-blur-md h-16 flex items-center px-4 sm:px-6">
    <div class="max-w-6xl mx-auto w-full flex items-center justify-between">
      <a href="/index.html" class="flex items-center group">
        <img src="/logo.png" alt="HackMate" class="h-8 sm:h-9 w-auto object-contain group-hover:scale-105 transition-transform" />
      </a>
      <a href="/browse-teams.html" class="text-xs sm:text-sm font-semibold text-ink-muted hover:text-terracotta transition-colors">
        ← Browse Teams
      </a>
    </div>
  </header>

  <!-- Auth Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:py-10">
    <div class="auth-card paper-card rounded-2xl max-w-md w-full p-6 sm:p-8 border border-canvas-border shadow-md">
      
      <!-- Top Brand Header -->
      <div class="mb-5 text-center">
        <span class="badge-tag uppercase font-mono text-[11px] text-terracotta font-bold px-2.5 py-0.5 rounded bg-terracotta-light border border-terracotta-border inline-block mb-1.5">
          Student Portal
        </span>
        <h1 class="font-heading font-black text-ink text-2xl">
          Welcome to HackMate
        </h1>
        <p class="text-xs text-ink-secondary mt-1">
          Sign in to post squad needs, pitch your skills, and manage applications.
        </p>
      </div>

      <!-- Auth Switcher Tabs -->
      <div class="flex items-center gap-1.5 p-1 rounded-xl bg-canvas-alt border border-canvas-border mb-5">
        <button
          id="tabSignIn"
          type="button"
          onclick="switchTab('signin')"
          class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-ink shadow-xs cursor-pointer"
        >
          Sign In
        </button>
        <button
          id="tabRegister"
          type="button"
          onclick="switchTab('register')"
          class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all text-ink-muted hover:text-ink cursor-pointer"
        >
          Register
        </button>
      </div>

      <!-- Alert Messages -->
      <div id="errorBox" class="hidden mb-4 p-3.5 rounded-xl bg-terracotta-light border border-terracotta-border text-terracotta text-xs font-semibold"></div>
      <div id="noticeBox" class="hidden mb-4 p-3.5 rounded-xl bg-ochre-light border border-ochre-border text-ochre text-xs font-semibold"></div>
      <div id="successBox" class="hidden mb-4 p-3.5 rounded-xl bg-sage-light border border-sage-border text-sage text-xs font-semibold"></div>

      <!-- 1. Sign In Form -->
      <form id="signInForm" class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Campus Email
          </label>
          <input
            type="email"
            id="loginEmail"
            required
            autocomplete="email"
            placeholder="student@campus.edu"
            class="w-full text-sm px-3.5 py-2.5 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink placeholder:text-ink-subtle transition-colors"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Password
          </label>
          <input
            type="password"
            id="loginPassword"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full text-sm px-3.5 py-2.5 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink placeholder:text-ink-subtle transition-colors"
          />
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="interactive-btn w-full py-2.5 rounded-lg text-sm font-bold bg-terracotta text-white hover:bg-terracotta-hover transition-colors shadow-xs cursor-pointer mt-1"
        >
          Sign In
        </button>
      </form>

      <!-- 2. Registration Form -->
      <form id="registerForm" class="hidden space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Full Name *
          </label>
          <input
            type="text"
            id="regName"
            required
            placeholder="e.g. Piyush Sharma"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Campus Email *
          </label>
          <input
            type="email"
            id="regEmail"
            required
            placeholder="piyush@campus.edu"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
          />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Password *
          </label>
          <input
            type="password"
            id="regPassword"
            required
            minlength="4"
            placeholder="Min 4 characters"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
          />
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
              Branch
            </label>
            <input
              type="text"
              id="regBranch"
              placeholder="e.g. CS / IT"
              class="w-full text-sm px-3 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
            />
          </div>

          <div>
            <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
              Year
            </label>
            <select
              id="regYear"
              class="w-full text-sm px-3 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
            >
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year" selected>3rd Year</option>
              <option value="4th Year">4th Year</option>
              <option value="Postgraduate">PG</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-ink-muted uppercase tracking-wider mb-1 font-mono">
            Skills (comma-separated)
          </label>
          <input
            type="text"
            id="regSkills"
            placeholder="React, Python, OpenCV, Node.js"
            class="w-full text-sm px-3.5 py-2 border border-canvas-border rounded-lg bg-white focus:outline-none focus:border-terracotta text-ink"
          />
        </div>

        <button
          type="submit"
          id="regBtn"
          class="interactive-btn w-full py-2.5 rounded-lg text-sm font-bold bg-terracotta text-white hover:bg-terracotta-hover transition-colors shadow-xs cursor-pointer mt-1"
        >
          Create Profile
        </button>
      </form>

      <!-- Pre-seeded Demo Accounts -->
      <div class="mt-6 pt-4 border-t border-canvas-border">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold font-mono text-ink-muted uppercase tracking-wider">
            Quick Test Logins:
          </span>
          <span class="text-[10px] text-ink-muted">Click to fill</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button
            type="button"
            onclick="fillDemo('aarav.mehta@campus.edu', 'student123')"
            class="p-2 rounded-lg bg-canvas-alt border border-canvas-border hover:border-terracotta text-left transition-all hover:bg-white"
          >
            <div class="font-bold text-ink text-xs truncate">Aarav M.</div>
            <div class="text-[10px] text-terracotta font-mono truncate">SIH Lead</div>
          </button>

          <button
            type="button"
            onclick="fillDemo('ananya.d@campus.edu', 'student123')"
            class="p-2 rounded-lg bg-canvas-alt border border-canvas-border hover:border-terracotta text-left transition-all hover:bg-white"
          >
            <div class="font-bold text-ink text-xs truncate">Ananya D.</div>
            <div class="text-[10px] text-ochre font-mono truncate">ETHIndia</div>
          </button>

          <button
            type="button"
            onclick="fillDemo('kabir.roy@campus.edu', 'student123')"
            class="p-2 rounded-lg bg-canvas-alt border border-canvas-border hover:border-terracotta text-left transition-all hover:bg-white"
          >
            <div class="font-bold text-ink text-xs truncate">Kabir R.</div>
            <div class="text-[10px] text-sage font-mono truncate">Backend</div>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="py-4 text-center text-xs text-ink-muted border-t border-canvas-border">
    HackMate • Secure Authentication
  </footer>

  <script>
    function switchTab(mode) {
      const isSignIn = mode === 'signin';
      const signInForm = document.getElementById('signInForm');
      const registerForm = document.getElementById('registerForm');
      const tabSignIn = document.getElementById('tabSignIn');
      const tabRegister = document.getElementById('tabRegister');

      if (isSignIn) {
        signInForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabSignIn.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-ink shadow-xs cursor-pointer';
        tabRegister.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all text-ink-muted hover:text-ink cursor-pointer';
        if (typeof gsap !== 'undefined') {
          gsap.fromTo(signInForm, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
        }
      } else {
        registerForm.classList.remove('hidden');
        signInForm.classList.add('hidden');
        tabRegister.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-ink shadow-xs cursor-pointer';
        tabSignIn.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all text-ink-muted hover:text-ink cursor-pointer';
        if (typeof gsap !== 'undefined') {
          gsap.fromTo(registerForm, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
        }
      }

      hideAlerts();
    }

    if (window.location.hash === '#register') {
      switchTab('register');
    }

    function hideAlerts() {
      document.getElementById('errorBox').classList.add('hidden');
      document.getElementById('noticeBox').classList.add('hidden');
      document.getElementById('successBox').classList.add('hidden');
    }

    function fillDemo(email, pass) {
      switchTab('signin');
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      hideAlerts();
      if (typeof gsap !== 'undefined') {
        gsap.fromTo('#loginBtn', { scale: 0.96 }, { scale: 1, duration: 0.2 });
      }
    }

    // Sign In Submission
    const signInForm = document.getElementById('signInForm');
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerText = 'Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const apiBase = (window.__API_BASE__ || '').replace(/\/$/, '');
        const res = await fetch(`${apiBase}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          if (data.notFound) {
            const errBox = document.getElementById('errorBox');
            errBox.innerHTML = `
              <div>${data.error}</div>
              <button type="button" onclick="prefillRegister('${email}')" class="mt-2 inline-block px-3 py-1 rounded bg-terracotta text-white text-xs font-bold hover:bg-terracotta-hover">
                Register with ${email} →
              </button>
            `;
            errBox.classList.remove('hidden');
            return;
          }
          throw new Error(data.error || 'Login failed');
        }

        localStorage.setItem('htf_token', data.token);
        localStorage.setItem('htf_user', JSON.stringify(data.user));
        window.location.href = '/browse-teams.html';
      } catch (err) {
        const errBox = document.getElementById('errorBox');
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Sign In';
      }
    });

    function prefillRegister(email) {
      switchTab('register');
      document.getElementById('regEmail').value = email;
      document.getElementById('regName').focus();
    }

    // Register Submission
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();
      const regBtn = document.getElementById('regBtn');
      regBtn.disabled = true;
      regBtn.innerText = 'Creating profile...';

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const branch = document.getElementById('regBranch').value.trim();
      const year = document.getElementById('regYear').value;
      const skillsRaw = document.getElementById('regSkills').value;

      const skills = skillsRaw
        .split(',')
        .map(s => s.trim())
        .filter(s => s.length > 0);

      try {
        const apiBase = (window.__API_BASE__ || '').replace(/\/$/, '');
        const res = await fetch(`${apiBase}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, branch, year, skills })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        localStorage.setItem('htf_token', data.token);
        localStorage.setItem('htf_user', JSON.stringify(data.user));
        window.location.href = '/browse-teams.html';
      } catch (err) {
        const errBox = document.getElementById('errorBox');
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        regBtn.disabled = false;
        regBtn.innerText = 'Create Profile';
      }
    });

    // GSAP Initial Entrance
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('.auth-card', {
          opacity: 0,
          y: 20,
          duration: 0.5,
          ease: 'power3.out'
        });
      }
    });
  </script>

</body>
</html>
